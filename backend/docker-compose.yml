version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: pitwall-postgres
    environment:
      POSTGRES_DB: pitwall_insights
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pitwall_postgres_data:/var/lib/postgresql/data

volumes:
  pitwall_postgres_data: