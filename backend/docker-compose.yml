services:
  postgres:
    image: postgres:16
    container_name: pitwall-postgres
    environment:
      POSTGRES_DB: pitwall_insights
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pitwall_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pitwall_insights"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  pitwall_postgres_data:
